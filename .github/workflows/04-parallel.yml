name: Lab 04 parallel checks
on:
  workflow_dispatch:
    inputs:
      fail-test:
        description: Fail the test branch after its tests pass (failure-propagation experiment)
        type: boolean
        default: false
permissions: {}
cache-mode: none
jobs:
  sequential:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
  shared-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app
        # TODO: Replace this placeholder with a `parallel:` group on this runner.
        # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepsparallel
        # Run the app's lint command and test command at the same time.
        # Both must finish successfully before the existing build step can start.
        # In the test branch, run the real tests first. If the fail-test input is
        # true, then deliberately fail that branch so you can check that the
        # build is skipped. Do not hide the failure or install packages in parallel.
        # Keep the sequential job unchanged as the comparison. See Lab 4.
      - parallel:
          - name: Lint
            run: npm run lint
            working-directory: app
          - name: Test
            run: |
              npm test
              if [ "${{ inputs.fail-test }}" = "true" ]; then
                echo "Deliberately failing the test branch"
                exit 1
              fi
            working-directory: app
      - run: npm run build
        working-directory: app
  separate-runners:
    strategy:
      matrix:
        check: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app
      - name: Run ${{ matrix.check }}
        run: |
          npm run "${{ matrix.check }}"
          if [ "${{ matrix.check }}" = "test" ] && [ "${{ inputs.fail-test }}" = "true" ]; then
            echo "Deliberately failing the test job"
            exit 1
          fi
        working-directory: app
  separate-build:
    needs: separate-runners
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run build
        working-directory: app
